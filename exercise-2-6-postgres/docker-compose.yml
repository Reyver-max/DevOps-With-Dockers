services:
  frontend:
    image: example-frontend
    ports:
      - "5001:5001"

  backend:
    image: example-backend
    ports:
      - "8080:8080"
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DATABASE=postgres
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:alpine

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
